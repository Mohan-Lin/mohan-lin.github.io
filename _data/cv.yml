  image: ""
  summary: >-
    I received the B.E. degree from the Department of Automation, Hangzhou
    Dianzi University, Hangzhou, China, in 2022. I am currently pursuing the
    Ph.D. degree in Control Science and Engineering at Hangzhou Dianzi
    University and working as a visiting Ph.D. student at The Hong Kong
    Polytechnic University. My research focuses on uncertainty quantification
    and optimal operation of power systems. I am experienced in developing
    optimization models using Python/MATLAB with Gurobi and conducting
    transient stability simulations using Python with PowerWorld.
