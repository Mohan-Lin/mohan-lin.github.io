    Projects:
      - name: "Optimization Theory and Key Technologies for Power Balance in New Power System Based on Characterization of Output Prediction Uncertainty of Renewable Energy Dynamic Aggregations"
        summary: "Key Researcher. National Natural Science Foundation of China, Grant U25B20191."
        start_date: 2026-01-01
        end_date: 2029-12-01

      - name: "Fundamental Theory and Technology of Autonomically Coordinated Regional Energy Internet Planning and Operation Based on Generalized Carbon Emission Trajectory"
        summary: "Key Researcher. National Natural Science Foundation of China, Grant U2166211."
        start_date: 2022-01-01
        end_date: 2025-12-01
        highlights:
          - Investigated uncertainty-aware planning and operation of regional energy internet systems under carbon-neutrality targets.
          - Conducted research on stochastic production simulation, energy-carbon coupling, and coordinated operation of shared energy storage.

      - name: "Grey-Box Perception and Intelligent Control for Low-Voltage Distribution Networks with Multi-Source Uncertainty"
        summary: "Project Leader. Science and Technology Project of Zhejiang Province, Grant SGTYHT/23-JS-003."
        start_date: 2025-09-01
        end_date: 2026-12-01
        highlights:
          - Investigated multi-source uncertainty quantification and correlation modeling for low-voltage distribution networks.
          - Developed data-driven state inference and optimization-based regulation strategies under uncertain operating conditions.

      - name: "Coordinated Control Technologies for County-Level Distribution Grids with Large-Scale Integration of Energy-Autonomous Microgrids"
        summary: "Project Leader. State Grid Corporation of China, Grant 5400-202319829A-4-1-KJ."
        start_date: 2023-12-01
        end_date: 2025-12-01
        highlights:
          - Investigated topology identification, uncertainty-aware microgrid scheduling, and coordinated operation of distribution networks and microgrid clusters.
          - Developed optimization and learning-based methods for improving operational economy and renewable energy accommodation.

      - name: "Data-Driven Autonomous Coordination for the Optimal Operation of Large-Scale DER Clusters in Active Distribution Networks"
        summary: "Key Researcher. Science and Technology Project of Zhejiang Province, Grant SGTYHT/23-JS-004."
        start_date: 2023-11-01
        end_date: 2024-06-01
        highlights:
          - Investigated data-driven aggregation and coordinated optimization of large-scale distributed energy resource clusters.
          - Developed surrogate and learning-based approaches for computationally efficient scheduling and real-time control.

